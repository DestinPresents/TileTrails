<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tile Trails — Latest Version</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
        }

        body {
            background:
                radial-gradient(circle at 50% 45%, #18244a 0%, #0b1022 35%, #050711 75%, #02030a 100%);
            color: #ffffff;
            position: relative;
        }

        /* Ambient glow */
        body::before {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(
                circle,
                rgba(95, 125, 255, 0.16),
                rgba(95, 125, 255, 0.04) 40%,
                transparent 72%
            );
            filter: blur(25px);
            pointer-events: none;
        }

        /* Particle canvas */
        #particles {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Main center area */
        .page {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Premium popup */
        .popup {
            width: min(390px, 92vw);
            padding: 30px 28px 28px;

            background: rgba(12, 17, 38, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);

            text-align: center;

            animation: popupIn 0.8s cubic-bezier(.16, 1, .3, 1);
        }

        @keyframes popupIn {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.94);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Logo / title */
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 23px;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;

            background:
                linear-gradient(135deg, #7c8cff, #5267ff);

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 17px;
            font-weight: 800;

            box-shadow:
                0 8px 25px rgba(83, 105, 255, 0.35);
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .content h1 {
            font-size: 25px;
            line-height: 1.25;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 11px;
        }

        .content p {
            color: rgba(255, 255, 255, 0.58);
            font-size: 14px;
            line-height: 1.6;
            margin: 0 auto 24px;
            max-width: 300px;
        }

        /* Download button */
        .download-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            width: 100%;
            height: 52px;

            border-radius: 14px;

            color: #ffffff;
            text-decoration: none;

            background: linear-gradient(
                135deg,
                #7080ff,
                #5367ff
            );

            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.2px;

            box-shadow:
                0 12px 30px rgba(77, 96, 255, 0.28);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                filter 0.25s ease;

            overflow: hidden;
        }

        /* Shine animation */
        .download-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;

            width: 70%;
            height: 100%;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.22),
                transparent
            );

            transform: skewX(-20deg);
            transition: left 0.65s ease;
        }

        .download-btn:hover::before {
            left: 150%;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);

            box-shadow:
                0 17px 38px rgba(77, 96, 255, 0.4);
        }

        .download-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .download-icon {
            width: 19px;
            height: 19px;
        }

        .version {
            margin-top: 18px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.32);
            letter-spacing: 0.5px;
        }

        /* Small decorative line */
        .line {
            width: 42px;
            height: 3px;
            border-radius: 10px;
            margin: 0 auto 20px;

            background: linear-gradient(
                90deg,
                transparent,
                #7180ff,
                transparent
            );

            opacity: 0.8;
        }

        /* Mobile */
        @media (max-width: 480px) {
            .popup {
                padding: 27px 22px 24px;
                border-radius: 21px;
            }

            .content h1 {
                font-size: 23px;
            }

            .brand {
                margin-bottom: 20px;
            }

            .download-btn {
                height: 50px;
            }
        }

        /* Respect reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <canvas id="particles"></canvas>

    <main class="page">

        <section class="popup">

            <div class="brand">
                <div class="brand-icon">T</div>
                <div class="brand-name">Tile Trails</div>
            </div>

            <div class="line"></div>

            <div class="content">
                <h1>Download Our Latest Version</h1>

                <p>
                    Experience the newest version of Tile Trails
                    with improvements, fixes and a smoother gameplay experience.
                </p>

                <a
                    class="download-btn"
                    href="https://drive.google.com/file/d/1ftgop-hjDPFYSTiVIyuMPJIgHrjPuIVH/view?usp=drivesdk"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <svg
                        class="download-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M12 3v12"></path>
                        <path d="m7 10 5 5 5-5"></path>
                        <path d="M5 21h14"></path>
                    </svg>

                    Download Latest Version
                </a>

                <div class="version">
                    Tile Trails • Official Download
                </div>
            </div>

        </section>

    </main>


    <script>
        const canvas = document.getElementById("particles");
        const ctx = canvas.getContext("2d");

        let particles = [];
        let width = 0;
        let height = 0;

        function resizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);

            width = window.innerWidth;
            height = window.innerHeight;

            canvas.width = width * dpr;
            canvas.height = height * dpr;

            canvas.style.width = width + "px";
            canvas.style.height = height + "px";

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            createParticles();
        }

        function createParticles() {
            particles = [];

            const amount = Math.min(
                120,
                Math.max(45, Math.floor((width * height) / 12000))
            );

            for (let i = 0; i < amount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,

                    size: Math.random() * 1.7 + 0.4,

                    speedX: (Math.random() - 0.5) * 0.35,
                    speedY: (Math.random() - 0.5) * 0.35,

                    opacity: Math.random() * 0.55 + 0.12,

                    pulse: Math.random() * Math.PI * 2,
                    pulseSpeed: Math.random() * 0.02 + 0.008
                });
            }
        }

        function drawParticles() {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];

                p.x += p.speedX;
                p.y += p.speedY;

                p.pulse += p.pulseSpeed;

                const pulseOpacity =
                    p.opacity *
                    (0.7 + Math.sin(p.pulse) * 0.3);

                // Wrap around screen
                if (p.x < -10) p.x = width + 10;
                if (p.x > width + 10) p.x = -10;

                if (p.y < -10) p.y = height + 10;
                if (p.y > height + 10) p.y = -10;

                // Glow
                ctx.beginPath();

                ctx.fillStyle =
                    `rgba(130, 150, 255, ${pulseOpacity * 0.15})`;

                ctx.arc(
                    p.x,
                    p.y,
                    p.size * 4,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

                // Particle
                ctx.beginPath();

                ctx.fillStyle =
                    `rgba(185, 198, 255, ${pulseOpacity})`;

                ctx.arc(
                    p.x,
                    p.y,
                    p.size,
                    0,
                    Math.PI * 2
                );

                ctx.fill();
            }

            // Very subtle connecting lines
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {

                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;

                    const distance = Math.sqrt(
                        dx * dx + dy * dy
                    );

                    if (distance < 105) {
                        const opacity =
                            (1 - distance / 105) * 0.07;

                        ctx.beginPath();

                        ctx.strokeStyle =
                            `rgba(120, 140, 255, ${opacity})`;

                        ctx.lineWidth = 0.6;

                        ctx.moveTo(
                            particles[i].x,
                            particles[i].y
                        );

                        ctx.lineTo(
                            particles[j].x,
                            particles[j].y
                        );

                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(drawParticles);
        }

        window.addEventListener("resize", resizeCanvas);

        resizeCanvas();
        drawParticles();
    </script>

</body>
</html>
